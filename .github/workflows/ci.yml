name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: format · analyze · test · debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true

      - run: flutter pub get

      # Formatting gate — keep sources `dart format`-clean (scoped to lib/test
      # so generated `build/` output is never walked).
      - run: dart format --output=none --set-exit-if-changed lib test

      - run: flutter analyze

      - run: flutter test

      # Proves the Android scaffold (gradle, ONNX/ML Kit native, ads/IAP
      # plugins) assembles. Slow-ish; the real value gate for each milestone.
      - run: flutter build apk --debug
