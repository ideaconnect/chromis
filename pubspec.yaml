name: chromis
description: "Chromis BG Removal - cut out backgrounds, remove objects, add text & speech bubbles, all on-device."
# Prevents accidental publication to pub.dev (this is a private app package).
publish_to: 'none'

# version: <name>+<build>. build-name -> Android versionName, build-number -> versionCode.
# The build number moves with every upload, not just with the name: Play requires
# a strictly higher versionCode per track and rejects a re-upload at the same one.
version: 1.3.0+6

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  cupertino_icons: ^1.0.8
  go_router: ^17.3.0
  flutter_riverpod: ^3.3.2
  image_picker: ^1.2.3
  # Pick user .ttf/.otf font files for the Text tool's custom-font import (MIT).
  file_picker: ^8.1.0
  path_provider: ^2.1.6
  pasteboard: ^0.5.0
  # On-device AI: ML Kit subject segmentation (built-in) + ONNX Runtime for the
  # bundled U²-Netp (background) and MobileSAM (object) models. Apache-2.0.
  google_mlkit_subject_segmentation: ^0.1.0
  flutter_onnxruntime: ^1.8.2
  image: ^4.9.1
  # Pinned to 12.x: 13.x needs win32 ^6 which conflicts with file_picker's
  # win32 ^5 (both are Windows-only transitives, irrelevant to this Android app).
  # The ShareParams/SharePlus.instance API used here is unchanged across 12↔13.
  share_plus: ^12.0.2
  # Monetization (free app): AdMob (banner/interstitial/rewarded + UMP consent)
  # and one-time non-consumable "Go Pro - remove ads" purchase.
  google_mobile_ads: ^9.0.0
  in_app_purchase: ^3.3.0
  # Open external links (the community Discord) in the browser / Discord app.
  # BSD-3-Clause.
  url_launcher: ^6.3.1
  # Render the Discord brand mark for the Home community button. MIT.
  flutter_svg: ^2.0.10
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  bdd_widget_test: ^2.1.4
  build_runner: ^2.15.1

flutter:
  uses-material-design: true

  # Generate AppLocalizations from lib/l10n/*.arb (see l10n.yaml).
  generate: true

  assets:
    # In-app mark (other assets/branding/* are build-time sources for the icon/
    # splash generators and need not ship in the APK).
    - assets/branding/logo.png
    # On-device background removal fallback: bundled U²-Netp ONNX (Apache-2.0).
    - assets/models/u2netp.onnx
    # MobileSAM point-prompt object removal: encoder once per photo, decoder per
    # tap. Apache-2.0, converted by model_conversion/convert_mobile_sam.py.
    - assets/models/mobile_sam_encoder.onnx
    - assets/models/mobile_sam_decoder.onnx
    # Generative fill, the top tier of object removal's "Fill in". MI-GAN
    # (MIT), converted by model_conversion/convert_migan.py. Absent, Fill still
    # works - it falls through to the pure-Dart ContentFillEngine, which is why
    # this is safe to drop. See docs/inpaint-setup.md.
    - assets/models/migan.onnx
    # Bundled AI model licenses (MobileSAM + U²-Netp, Apache-2.0).
    - assets/licenses/Apache-2.0-models.txt
    # MI-GAN is MIT, not Apache-2.0, so it needs its own notice: the licence
    # requires the copyright line be reproduced verbatim.
    - assets/licenses/MIT-migan.txt
    # Bundled font license texts - registered into LicenseRegistry as SIL OFL /
    # Apache-2.0 require. Reskinned to Space Grotesk + Manrope in M0; the full
    # display-font set lands in M4. See about/bundled_licenses.dart.
    - assets/fonts/OFL-SpaceGrotesk.txt
    - assets/fonts/OFL-Manrope.txt
    - assets/fonts/OFL-Bangers.txt
    - assets/fonts/LICENSE-LuckiestGuy-Apache.txt
    - assets/fonts/OFL-Pacifico.txt
    - assets/fonts/OFL-Rubik.txt

  # Bundled OFL/Apache fonts (offline; see assets/fonts/ for license files).
  # NOTE: reskinned to the design's Space Grotesk (headings) + Manrope (body) in
  # the M0 design-system issue; the 17-font Text-tool set is added in M4.
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Variable.ttf
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf
    - family: Bangers
      fonts:
        - asset: assets/fonts/Bangers-Regular.ttf
    - family: LuckiestGuy
      fonts:
        - asset: assets/fonts/LuckiestGuy-Regular.ttf
    - family: Pacifico
      fonts:
        - asset: assets/fonts/Pacifico-Regular.ttf
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik-Variable.ttf

# Every asset below is generated by tool/gen_branding.py from the icon design in
# assets/branding/modern.png - run it before regenerating icons or splash.
#
# The adaptive icon is split the way Android actually composites it: the tile's
# recovered background gradient is a SQUARE full-bleed layer and only the artwork
# sits in the foreground, placed so the visible 72 of the drawable's 108dp is the
# design at its own proportions. So whatever mask a launcher applies - circle,
# squircle, teardrop - it cuts gradient instead of artwork, and no corner radius
# of ours gets re-cut by one of the OS's. The legacy square icon is unused at
# minSdk 26 but still generated, so it gets the whole rounded tile.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/appicon.png"
  adaptive_icon_background: "assets/branding/icon_background.png"
  adaptive_icon_foreground: "assets/branding/icon_foreground.png"
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 26

flutter_native_splash:
  color: "#0a1826"
  background_image: "assets/branding/splash_bg.png"
  image: assets/branding/splash.png
  android_12:
    # Must match _Splash._base in lib/app/app.dart (the gradient's dark centre
    # stop) so the native → in-app animated splash hands off with no colour cut.
    color: "#0a1526"
    # Pre-padded by tool/gen_branding.py so the OS's circular splash mask never
    # reaches the badge - it keeps its own corner radius instead of being cut
    # into a circle. No icon_background_color: the circle would be invisible
    # anyway (same colour as the splash) and asking for one shrinks the icon
    # canvas from 288dp to 240dp, i.e. a 20% smaller logo for nothing.
    #
    # Both splash images are the bare tile. Its gradient is mid-tone teal against
    # this #0a1526 splash, so it reads without a light plate behind it - which is
    # what lets the splash keep the dark colour that hands off to Home with no
    # seam. The icon before this one was #0A2127, the same dark as the splash,
    # and did need one.
    image: assets/branding/splash_android12.png
